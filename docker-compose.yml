version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: misarh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-misarh_db}
      POSTGRES_USER: ${DATABASE_USER:-misarh_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-misarh_password}
    ports:
      - '${DATABASE_PORT:-54320}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - misarh-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-misarh_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: misarh-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6399}:6379'
    volumes:
      - redis_data:/data
    networks:
      - misarh-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

